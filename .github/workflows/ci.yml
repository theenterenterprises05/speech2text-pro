# .github/workflows/ci.yml
# ─────────────────────────────────────────────────────────────────────────────
# Continuous Integration for Speech2Text Pro
# Runs on every push / PR to main or develop branches.
# Matrix: Node 18, 20, 22  (matches Render free tier + LTS support window)
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Smoke tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: ["18", "20", "22"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start server & run smoke tests
        run: |
          # Start server in background (in-memory DB, no postgres needed)
          PORT=3123 npm start &
          SERVER_PID=$!

          # Wait for server to be ready (up to 15s)
          for i in $(seq 1 15); do
            curl -sf http://localhost:3123/api/health && break
            sleep 1
          done

          # Run smoke tests
          BASE_URL=http://localhost:3123 npm test
          EXIT_CODE=$?

          kill $SERVER_PID 2>/dev/null || true
          exit $EXIT_CODE

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t speech2text-pro:ci .

      - name: Verify image starts
        run: |
          docker run -d --name s2t-test -p 3000:3000 -e NODE_ENV=test speech2text-pro:ci
          sleep 5
          curl -sf http://localhost:3000/api/health | grep '"ok":true'
          docker stop s2t-test
